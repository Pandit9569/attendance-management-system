<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Student Dashboard</h2>
</div>

<div class="container">

    <div class="card">

        <h2>Welcome, {{ student.name }}</h2>

        <p>
            <strong>Roll Number:</strong>
            {{ student.roll_no }}
        </p>

        <p>
            <strong>Course:</strong>
            {{ student.course }}
        </p>

        <a href="/student_report" class="btn">
            View My Attendance
        </a>

    </div>

</div>
<a href="/"
   style="display:inline-block;
          margin-top:20px;
          padding:10px 18px;
          background:#2563eb;
          color:white;
          text-decoration:none;
          border-radius:6px;">
    ← Back to Main Dashboard
</a>

</body>
</html>
