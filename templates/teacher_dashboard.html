<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .subject {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Teacher Dashboard</h2>
    </div>

    <div class="container">

        <div class="card">

            <h2>Welcome, {{ teacher.username }}</h2>

            <p>Your Assigned Subject:</p>

            <div class="subject">
                {{ teacher.subject }}
            </div>

            <a href="/teacher_attendance" class="btn">
                Mark Attendance
            </a>
            <br>

<a href="/teacher_report" class="btn">
    View Attendance Report
</a>

        </div>

    </div>
    <a href="/"
   style="display:inline-block;
          margin-top:20px;
          padding:10px 18px;
          background:#2563eb;
          color:white;
          text-decoration:none;
          border-radius:6px;">
    ← Back to Main Dashboard
</a>

</body>
</html>
