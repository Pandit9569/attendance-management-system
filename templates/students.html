<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        button {
            padding: 8px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin: 2px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Add Student</h2>

        <form action="/add_student" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Student Name"
                required
            >

            <input
                type="text"
                name="roll_no"
                placeholder="Roll Number"
                required
            >

            <input
                type="text"
                name="course"
                placeholder="Course"
                required
            >

            <input
                type="text"
                name="username"
                placeholder="Student Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Student Password"
                required
            >

            <button type="submit" class="add-btn">
                Add Student
            </button>

        </form>

    </div>

    <h2>Student List</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Course</th>
            <th>Username</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.roll_no }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.username }}</td>

            <td>

                <a href="/delete_student_attendance/{{ student.id }}"
                   onclick="return confirm('Are you sure you want to delete this student attendance?')">

                    <button style="background:#f59e0b;">
                        Delete Attendance
                    </button>

                </a>

                <a href="/delete_student/{{ student.id }}"
                   onclick="return confirm('Are you sure you want to delete this student?')">

                    <button style="background:#ef4444;">
                        Delete Student
                    </button>

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    <a href="/admin_dashboard" class="back">
        ← Back to Admin Dashboard
    </a>

</div>

</body>
</html>
