<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Attendance Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc2626;
            padding: 9px 15px;
            border-radius: 6px;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>Attendance Management System</h2>

        <a class="logout" href="/">Logout</a>

    </div>

    <div class="container">

        <div class="welcome">
            <h1>Dashboard</h1>
            <p>Welcome to the Attendance Management System.</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Present Today</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Absent Today</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <p>0%</p>
            </div>

        </div>

    </div>

</body>
</html>
