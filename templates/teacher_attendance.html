<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .subject {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .present {
            background: #16a34a;
        }

        .absent {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Teacher Attendance</h2>
    </div>

    <div class="container">

        <div class="subject">
            Subject: {{ teacher.subject }}
        </div>

        <table>

            <tr>
                <th>Roll No.</th>
                <th>Student Name</th>
                <th>Course</th>
                <th>Attendance</th>
            </tr>

            {% for student in students %}

            <tr>

                <td>{{ student.roll_no }}</td>

                <td>{{ student.name }}</td>

                <td>{{ student.course }}</td>

                <td>

                    <form action="/teacher_mark_attendance" method="POST" style="display:inline;">

                        <input type="hidden" name="student_id" value="{{ student.id }}">
                        <input type="hidden" name="status" value="Present">

                        <button class="present" type="submit">
                            Present
                        </button>

                    </form>


                    <form action="/teacher_mark_attendance" method="POST" style="display:inline;">

                        <input type="hidden" name="student_id" value="{{ student.id }}">
                        <input type="hidden" name="status" value="Absent">

                        <button class="absent" type="submit">
                            Absent
                        </button>

                    </form>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>
    <a href="/teacher_dashboard"
   style="display:inline-block;
          margin-top:20px;
          padding:10px 18px;
          background:#2563eb;
          color:white;
          text-decoration:none;
          border-radius:6px;">
    ← Back to Teacher Dashboard
</a>

</body>
</html>
