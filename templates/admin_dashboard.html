<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 10px;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Admin Dashboard</h2>
    </div>

    <div class="container">

        <div class="card">
            <h2>Teacher Management</h2>
            <p>Add and manage teachers.</p>

            <a href="/add_teacher" class="btn">
                Add Teacher
            </a>
            <a href="/teachers" class="btn">
                View Teachers
            </a>
        </div>

        <div class="card">
            <h2>Student Management</h2>
            <p>Add and manage students.</p>

            <a href="/students" class="btn">
                Manage Students
            </a>
        </div>

        <div class="card">
            <h2>Attendance Report</h2>
            <p>View all students' attendance.</p>

            <a href="/report" class="btn">
                View Report
            </a>
        </div>

    </div>
    <a href="/"
   style="display:inline-block;
          margin-top:20px;
          padding:10px 18px;
          background:#2563eb;
          color:white;
          text-decoration:none;
          border-radius:6px;">
    ← Back to Main Dashboard
</a>

</body>
</html>
